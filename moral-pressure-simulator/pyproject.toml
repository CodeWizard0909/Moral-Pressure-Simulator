[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "moral-pressure-simulator"
version = "0.1.0"
description = "An RL environment that trains AI agents to resist moral pressure while completing tasks ethically"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Team VeriCorp", email = "team@vericorp.dev"},
]
keywords = ["reinforcement-learning", "ai-safety", "openenv", "moral-reasoning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/team-vericorp/moral-pressure-simulator"
Repository = "https://github.com/team-vericorp/moral-pressure-simulator"
